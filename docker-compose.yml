services:
  db:
    image: postgres:16-alpine
    container_name: sisyphus_db
    environment:
      POSTGRES_USER: sisyphus
      POSTGRES_PASSWORD: sisyphus
      POSTGRES_DB: sisyphus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisyphus -d sisyphus"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sisyphus_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sisyphus:sisyphus@db:5432/sisyphus
      FRONTEND_ORIGIN: http://localhost:3000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-64-bytes-long-string-sample-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sisyphus_frontend
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_* variables are inlined at build time and accessed by browsers,
      # so localhost:8000 is correct (the user's browser hits the host-mapped port).
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
